# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Supply Chain Metadata

# Dispatched by the build workflow's finalize job with the immutable image
# digest, and available for manual runs. A workflow_run trigger cannot carry
# these inputs, so this workflow is dispatch-only.
on:
  workflow_dispatch:
    inputs:
      migrate_legacy_stable:
        description: Copy the existing legacy stable digest unchanged (manual approval required)
        required: false
        default: false
        type: boolean
      source_tag:
        description: Image tag to process
        required: true
        default: testing
        type: choice
        options:
          - latest
          - testing
          - latest-cachy
          - testing-cachy
      source_digest:
        description: Immutable image digest to process (required for manual runs)
        required: true
        type: string
      dispatch_iso:
        description: Dispatch the live ISO build after the image signature and provenance verify
        required: false
        default: false
        type: boolean
      source_sha:
        description: Source commit recorded in the image (required for manual runs)
        required: true
        type: string
      source_github_sha:
        description: Triggering GITHUB_SHA from the build workflow. May differ from source_sha for schedule-triggered builds of non-default branches.
        required: false
        type: string
      original_event:
        description: Event that triggered the build workflow. Schedule-triggered stable publishes use the reviewer-free stable-release-auto environment; manual dispatches use stable-release (manual approval).
        required: false
        type: string
      original_actor:
        description: Actor who triggered the build workflow. Repository-owner pushes skip the stable approval gate.
        required: false
        type: string

permissions:
  contents: write # zizmor: ignore[excessive-permissions]
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    if: inputs.migrate_legacy_stable != true
    name: Prepare metadata (${{ inputs.source_tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: read
    concurrency:
      group: supply-chain-prepare-${{ inputs.source_tag }}
      cancel-in-progress: false

    steps:
      - name: Validate dispatch inputs
        env:
          SOURCE_DIGEST: ${{ inputs.source_digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_GITHUB_SHA: ${{ inputs.source_github_sha }}
          ORIGINAL_EVENT: ${{ inputs.original_event }}
          ORIGINAL_ACTOR: ${{ inputs.original_actor }}
        run: |
          [[ "${SOURCE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "${SOURCE_GITHUB_SHA}" || "${SOURCE_GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${ORIGINAL_EVENT}" =~ ^[a-z_]*$ ]]
          # GitHub Apps report as name[bot] (cursor[bot], dependabot[bot], …).
          [[ "${ORIGINAL_ACTOR}" =~ ^([A-Za-z0-9-]+(\[bot\])?)?$ ]]

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight source image
        uses: ./.github/actions/preflight-image
        with:
          image-tag: ${{ inputs.source_tag }}
      - name: Prepare metadata variables
        id: meta
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Setup ORAS
        uses: ./.github/actions/setup-oras

      - name: Wait for image to be available in registry
        uses: ./.github/actions/wait-for-image
        with:
          image: ${{ steps.meta.outputs.image }}
          digest: ${{ inputs.source_digest }}

      - name: Validate immutable image identity and resolve previous digest
        id: image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_DIGEST: ${{ inputs.source_digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_DIGEST="${SOURCE_DIGEST}"
          build_files/scripts/validate-digest.sh "${CURRENT_DIGEST}"
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          LABELS_JSON="$(docker buildx imagetools inspect "${IMAGE}@${CURRENT_DIGEST}" --format '{{ json .Image.Config.Labels }}')"
          CURRENT_VERSION="$(jq -r '."org.opencontainers.image.version"' <<< "${LABELS_JSON}")"
          ACTUAL_REVISION="$(jq -r '."org.opencontainers.image.revision"' <<< "${LABELS_JSON}")"
          BASE_NAME="$(jq -r '."org.opencontainers.image.base.name"' <<< "${LABELS_JSON}")"
          BASE_DIGEST="$(jq -r '."org.opencontainers.image.base.digest"' <<< "${LABELS_JSON}")"
          UPSTREAM_BASE="$(jq -r '."org.kyth.build.upstream-base"' <<< "${LABELS_JSON}")"
          PROTON_CACHYOS_VERSION="$(jq -r '."org.kyth.build.proton-cachyos-version"' <<< "${LABELS_JSON}")"
          THIRDPARTY_HASH="$(jq -r '."org.kyth.build.thirdparty-versions-hash"' <<< "${LABELS_JSON}")"
          KERNEL_FLAVOR="$(jq -r '."org.kyth.build.kernel-flavor"' <<< "${LABELS_JSON}")"
          test "${ACTUAL_REVISION}" = "${SOURCE_SHA}"
          test "${SOURCE_SHA}" = "$(git rev-parse HEAD)"
          [[ "${CURRENT_VERSION}" =~ ^${TAG}\.[0-9]{8}\.[0-9]+\.[0-9]+\.[0-9a-f]{8}$ ]]
          test "${BASE_NAME}" = "${IMAGE}:base-${TAG}"
          [[ "${BASE_NAME}" =~ ^ghcr\.io/[a-z0-9._/-]+:[a-z0-9._-]+$ ]]
          build_files/scripts/validate-digest.sh "${BASE_DIGEST}"
          [[ "${UPSTREAM_BASE}" =~ ^(ghcr\.io/ublue-os/kinoite-main:44|quay\.io/fedora/fedora-kinoite:45)@sha256:[0-9a-f]{64}$ ]]
          [[ "${THIRDPARTY_HASH}" =~ ^[0-9a-f]{16}$ ]]
          # Kernel flavor must match the tag: plain tags are fedora, -cachy
          # tags are cachy. Both flavors get full supply-chain treatment
          # (signing, SBOM, CVE scan); the ISO is only built from fedora.
          if [[ "${TAG}" == *-cachy ]]; then
            test "${KERNEL_FLAVOR}" = cachy
          else
            test "${KERNEL_FLAVOR}" = fedora
          fi

          PREVIOUS_DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | python3 .github/scripts/resolve-previous-image-release.py "${TAG}" "${CURRENT_VERSION}")"

          echo "current_digest=${CURRENT_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "previous_digest=${PREVIOUS_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "base_name=${BASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "base_digest=${BASE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "upstream_base=${UPSTREAM_BASE}" >> "$GITHUB_OUTPUT"
          echo "proton_cachyos_version=${PROTON_CACHYOS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "thirdparty_hash=${THIRDPARTY_HASH}" >> "$GITHUB_OUTPUT"
          echo "kernel_flavor=${KERNEL_FLAVOR}" >> "$GITHUB_OUTPUT"

      - name: Setup Syft
        id: setup_syft
        uses: ./.github/actions/setup-anchore-tool
        with:
          tool: syft
          version: 1.39.0
          sha256: bb8f1ba8201d1ce0d99ab4f5243142629c1afba4da97a7c4ca2df97327f97190

      - name: Login rootful Podman to GHCR
        uses: ./.github/actions/registry-login
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          docker: "false"
          sudo-podman: "true"

      - name: Prepare image RPM database
        id: image_rootfs
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.image.outputs.current_digest }}
        run: |
          sudo podman pull "${IMAGE}@${DIGEST}"
          CONTAINER="$(sudo podman create "${IMAGE}@${DIGEST}" /usr/bin/true)"
          trap 'sudo podman rm --force "${CONTAINER}" >/dev/null' EXIT
          ROOTFS="$(sudo podman mount "${CONTAINER}")"
          sudo test -f "${ROOTFS}/usr/share/rpm/rpmdb.sqlite"
          SCAN_ROOT="${RUNNER_TEMP}/syft-root"
          mkdir -p "${SCAN_ROOT}/usr/share" "${SCAN_ROOT}/usr/lib"
          sudo cp -a "${ROOTFS}/usr/share/rpm" "${SCAN_ROOT}/usr/share/rpm"
          sudo cp "${ROOTFS}/usr/lib/os-release" "${SCAN_ROOT}/usr/lib/os-release"
          sudo chown -R "${USER}:${USER}" "${SCAN_ROOT}"
          echo "rootfs=${SCAN_ROOT}" >> "$GITHUB_OUTPUT"

      - name: Generate image SBOM
        id: sbom
        timeout-minutes: 30
        env:
          SYFT_CMD: ${{ steps.setup_syft.outputs.cmd }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.image.outputs.current_version }}
          DIGEST: ${{ steps.image.outputs.current_digest }}
          ROOTFS: ${{ steps.image_rootfs.outputs.rootfs }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          XDG_CACHE_HOME: ${{ runner.temp }}/syft-cache
        run: |
          SBOM="kyth-${TAG}-${VERSION}.syft.json"
          sudo "${SYFT_CMD}" "dir:${ROOTFS}" \
            --override-default-catalogers rpm-db-cataloger \
            --parallelism 1 \
            --source-name "${IMAGE}@${DIGEST}" \
            -o "syft-json=${SBOM}"
          sudo chown "${USER}:${USER}" "${SBOM}"
          jq -e '.artifacts | length > 0' "${SBOM}" >/dev/null
          echo "path=${SBOM}" >> "$GITHUB_OUTPUT"

      - name: Capture RPM manifest
        id: rpm_manifest
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.image.outputs.current_version }}
          SBOM_PATH: ${{ steps.sbom.outputs.path }}
        run: |
          OUT_FILE="rpm-manifest-${TAG}-${VERSION}.txt"
          python3 build_files/scripts/extract-rpm-manifest.py \
            --sbom "${SBOM_PATH}" \
            --output "${OUT_FILE}"
          echo "path=${OUT_FILE}" >> "$GITHUB_OUTPUT"

      - name: Capture optimization measurements
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.image.outputs.current_digest }}
          RPM_MANIFEST: ${{ steps.rpm_manifest.outputs.path }}
        run: |
          mkdir -p output/supply-chain
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw > "${RUNNER_TEMP}/kyth-oci-manifest.json"
          python3 build_files/scripts/optimization-report.py \
            --check \
            --oci-manifest "${RUNNER_TEMP}/kyth-oci-manifest.json" \
            --rpm-manifest "${RPM_MANIFEST}" \
            --output output/supply-chain/optimization.json

      - name: Setup Grype
        id: setup_grype
        uses: ./.github/actions/setup-anchore-tool
        with:
          tool: grype
          version: 0.88.0
          sha256: 7a7e1bf0caf88350eeb7433f41ce6e7b69d1eed57ce67abf24eae62562f38948

      - name: Scan current SBOM with Grype
        id: grype_current
        env:
          GRYPE_CMD: ${{ steps.setup_grype.outputs.cmd }}
          SBOM_PATH: ${{ steps.sbom.outputs.path }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.image.outputs.current_version }}
        run: |
          OUT="grype-current-${TAG}-${VERSION}.json"
          "${GRYPE_CMD}" "sbom:${SBOM_PATH}" -o json --file "${OUT}" || \
            echo "::warning::Grype scan failed; security section will be skipped"
          [[ -f "${OUT}" ]] && echo "path=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Pull previous image SBOM
        id: previous_sbom
        if: steps.image.outputs.previous_digest != ''
        uses: ./.github/actions/pull-sbom-referrer
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.image.outputs.previous_digest }}
          dest-dir: ${{ runner.temp }}/prev-sbom

      - name: Warn if previous image has no SBOM
        if: steps.image.outputs.previous_digest != '' && steps.previous_sbom.outputs.path == ''
        run: echo "::warning::Previous SBOM unavailable; package comparison will be marked unavailable and CVE diff skipped"

      - name: Scan previous SBOM with Grype
        id: grype_previous
        if: steps.previous_sbom.outputs.path != ''
        env:
          GRYPE_CMD: ${{ steps.setup_grype.outputs.cmd }}
          PREV_SBOM: ${{ steps.previous_sbom.outputs.path }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          OUT="grype-previous-${TAG}.json"
          "${GRYPE_CMD}" "sbom:${PREV_SBOM}" -o json --file "${OUT}" || \
            echo "::warning::Grype scan of previous SBOM failed; CVE diff will be incomplete"
          [[ -f "${OUT}" ]] && echo "path=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM-powered changelog
        id: changelog
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          CURRENT_TAG: ${{ steps.image.outputs.current_version }}
          CURRENT_DIGEST: ${{ steps.image.outputs.current_digest }}
          PREVIOUS_DIGEST: ${{ steps.image.outputs.previous_digest }}
          CURRENT_SHA: ${{ steps.image.outputs.source_sha }}
          CURRENT_SBOM: ${{ steps.sbom.outputs.path }}
          PREVIOUS_SBOM: ${{ steps.previous_sbom.outputs.path }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          GRYPE_CURRENT: ${{ steps.grype_current.outputs.path }}
          GRYPE_PREVIOUS: ${{ steps.grype_previous.outputs.path }}
        run: |
          NOTES="image-changelog-${CURRENT_TAG}.md"
          BRANCH=main
          if [[ "${SOURCE_TAG}" == "testing" || "${SOURCE_TAG}" == "testing-cachy" ]]; then
            BRANCH=testing
          fi
          GRYPE_ARGS=()
          [[ -n "${GRYPE_CURRENT}" ]] && GRYPE_ARGS+=(--grype-current "${GRYPE_CURRENT}")
          [[ -n "${GRYPE_PREVIOUS}" ]] && GRYPE_ARGS+=(--grype-previous "${GRYPE_PREVIOUS}")
          python3 .github/scripts/kyth_changelog.py \
            --image "${IMAGE}" \
            --branch "${BRANCH}" \
            --current-tag "${CURRENT_TAG}" \
            --current-digest "${CURRENT_DIGEST}" \
            --previous-digest "${PREVIOUS_DIGEST}" \
            --current-sha "${CURRENT_SHA}" \
            --current-sbom-file "${CURRENT_SBOM}" \
            --previous-sbom-file "${PREVIOUS_SBOM}" \
            "${GRYPE_ARGS[@]}" \
            --output "${NOTES}"
          echo "path=${NOTES}" >> "$GITHUB_OUTPUT"

      - name: Package publish inputs
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_SHA: ${{ steps.image.outputs.source_sha }}
          SOURCE_GITHUB_SHA: ${{ inputs.source_github_sha }}
          CURRENT_DIGEST: ${{ steps.image.outputs.current_digest }}
          CURRENT_VERSION: ${{ steps.image.outputs.current_version }}
          PREVIOUS_DIGEST: ${{ steps.image.outputs.previous_digest }}
          BASE_NAME: ${{ steps.image.outputs.base_name }}
          BASE_DIGEST: ${{ steps.image.outputs.base_digest }}
          UPSTREAM_BASE: ${{ steps.image.outputs.upstream_base }}
          PROTON_CACHYOS_VERSION: ${{ steps.image.outputs.proton_cachyos_version }}
          THIRDPARTY_HASH: ${{ steps.image.outputs.thirdparty_hash }}
          KERNEL_FLAVOR: ${{ steps.image.outputs.kernel_flavor }}
          RPM_MANIFEST: ${{ steps.rpm_manifest.outputs.path }}
          SBOM: ${{ steps.sbom.outputs.path }}
          NOTES: ${{ steps.changelog.outputs.path }}
        run: |
          mkdir -p output/supply-chain
          cp "${RPM_MANIFEST}" "${SBOM}" "${NOTES}" output/supply-chain/
          python3 build_files/scripts/generate-supply-chain-metadata.py \
            --image "${IMAGE}" \
            --tag "${TAG}" \
            --source-sha "${SOURCE_SHA}" \
            --source-github-sha "${SOURCE_GITHUB_SHA}" \
            --current-digest "${CURRENT_DIGEST}" \
            --current-version "${CURRENT_VERSION}" \
            --previous-digest "${PREVIOUS_DIGEST}" \
            --base-name "${BASE_NAME}" \
            --base-digest "${BASE_DIGEST}" \
            --upstream-base "${UPSTREAM_BASE}" \
            --proton-cachyos-version "${PROTON_CACHYOS_VERSION}" \
            --thirdparty-hash "${THIRDPARTY_HASH}" \
            --kernel-flavor "${KERNEL_FLAVOR}" \
            --rpm-manifest "${RPM_MANIFEST}" \
            --sbom "${SBOM}" \
            --notes "${NOTES}" \
            --output-dir "output/supply-chain"

      - name: Upload prepared metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-input-${{ inputs.source_tag }}-${{ github.run_id }}
          path: output/supply-chain/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish metadata (${{ inputs.source_tag }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Stable publishes go through the manual approval gate on stable-release.
    # The previous expression trusted `inputs.original_actor` (free-text on
    # manual dispatch, forgeable by any write-collaborator) and compared a
    # user login against the org name (never matches). Schedule-triggered
    # rebuilds use the reviewer-free stable-release-auto environment.
    environment: ${{ (inputs.source_tag == 'testing' || inputs.source_tag == 'testing-cachy') && 'testing-release' || (inputs.original_event == 'schedule' && 'stable-release-auto' || 'stable-release') }}
    permissions:
      actions: write
      contents: write
      packages: write
      id-token: write
    concurrency:
      group: supply-chain-publish-${{ inputs.source_tag }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Download prepared metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supply-chain-input-${{ inputs.source_tag }}-${{ github.run_id }}
          path: output/supply-chain

      - name: Validate publish inputs
        id: meta
        run: |
          METADATA=output/supply-chain/metadata.json
          jq -e . "${METADATA}" >/dev/null
          IMAGE="$(jq -r .image "${METADATA}")"
          TAG="$(jq -r .tag "${METADATA}")"
          SOURCE_SHA="$(jq -r .source_sha "${METADATA}")"
          GITHUB_SHA_META="$(jq -r '.github_sha // .source_sha' "${METADATA}")"
          DIGEST="$(jq -r .current_digest "${METADATA}")"
          VERSION="$(jq -r .current_version "${METADATA}")"
          BUILD_BASE="$(jq -r .materials.build_base "${METADATA}")"
          UPSTREAM_BASE="$(jq -r .materials.upstream_base "${METADATA}")"
          PROTON_CACHYOS_VERSION="$(jq -r .materials.proton_cachyos_version "${METADATA}")"
          THIRDPARTY_HASH="$(jq -r .materials.thirdparty_versions_hash "${METADATA}")"
          KERNEL_FLAVOR="$(jq -r .materials.kernel_flavor "${METADATA}")"
          SBOM="$(jq -r .sbom "${METADATA}")"
          NOTES="$(jq -r .notes "${METADATA}")"

          [[ "${IMAGE}" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]
          [[ "${TAG}" == "latest" || "${TAG}" == "testing" || "${TAG}" == "latest-cachy" || "${TAG}" == "testing-cachy" ]]
          [[ "${TAG}" == "${MATRIX_SOURCE_TAG}" ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_SHA_META}" =~ ^[0-9a-f]{40}$ ]]
          build_files/scripts/validate-digest.sh "${DIGEST}"
          [[ "${VERSION}" =~ ^[a-z0-9._-]+$ ]]
          [[ "${BUILD_BASE}" =~ ^ghcr\.io/[a-z0-9._/-]+:[a-z0-9._-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "${UPSTREAM_BASE}" =~ ^(ghcr\.io/ublue-os/kinoite-main:44|quay\.io/fedora/fedora-kinoite:45)@sha256:[0-9a-f]{64}$ ]]
          [[ "${THIRDPARTY_HASH}" =~ ^[0-9a-f]{16}$ ]]
          if [[ "${TAG}" == *-cachy ]]; then
            test "${KERNEL_FLAVOR}" = cachy
          else
            test "${KERNEL_FLAVOR}" = fedora
          fi
          [[ "${SBOM}" == "$(basename "${SBOM}")" && -s "output/supply-chain/${SBOM}" ]]
          [[ "${NOTES}" == "$(basename "${NOTES}")" && -s "output/supply-chain/${NOTES}" ]]

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "github_sha=${GITHUB_SHA_META}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sbom=${SBOM}" >> "$GITHUB_OUTPUT"
          echo "notes=${NOTES}" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_SOURCE_TAG: ${{ inputs.source_tag }}

      - name: Setup ORAS
        uses: ./.github/actions/setup-oras
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cosign
        uses: ./.github/actions/setup-cosign

      - name: Load image signing key
        env:
          KYTH_COSIGN_PRIVATE_KEY: ${{ secrets.KYTH_COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.KYTH_COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KYTH_COSIGN_PRIVATE_KEY}"
          test -n "${COSIGN_PASSWORD}"
          umask 077
          KYTH_SIGNING_KEY_FILE="${RUNNER_TEMP}/kyth-cosign.key"
          printf '%s' "${KYTH_COSIGN_PRIVATE_KEY}" > "${KYTH_SIGNING_KEY_FILE}"
          echo "KYTH_SIGNING_KEY_FILE=${KYTH_SIGNING_KEY_FILE}" >> "$GITHUB_ENV"

      # H1: verify build provenance BEFORE minting signatures. The old order
      # signed first, then "verified" — the cosign verify trivially passed
      # on signatures this job just created, making this a signing oracle
      # for any digest a write-collaborator supplies via workflow_dispatch.
      - name: Verify build provenance before signing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.meta.outputs.digest }}
          GITHUB_SHA_META: ${{ steps.meta.outputs.github_sha }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh attestation verify "oci://${IMAGE}@${DIGEST}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build.yml" \
              --source-digest "${GITHUB_SHA_META}" \
              --deny-self-hosted-runners; then
              exit 0
            fi
            echo "Provenance not visible yet (attempt ${attempt}/5); retrying..."
            sleep 10
          done
          echo "::error::Build provenance could not be verified for ${IMAGE}@${DIGEST} — refusing to sign"
          exit 1

      - name: Sign container image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.meta.outputs.digest }}
          COSIGN_PASSWORD: ${{ secrets.KYTH_COSIGN_PASSWORD }}
        run: |
          # Static signature satisfies the native containers/image policy.
          cosign sign -y --key "${KYTH_SIGNING_KEY_FILE}" "${IMAGE}@${DIGEST}"
          # Keep the keyless signature for installer ISO verification and
          # existing consumers that pin the GitHub Actions workflow identity.
          cosign sign -y "${IMAGE}@${DIGEST}"

      - name: Attach and sign SBOM
        id: attach_sbom
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.meta.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
          SBOM: output/supply-chain/${{ steps.meta.outputs.sbom }}
          COSIGN_PASSWORD: ${{ secrets.KYTH_COSIGN_PASSWORD }}
        run: |
          ATTACH_OUTPUT="$(oras attach --format json \
            --artifact-type application/vnd.syft+json \
            --annotation "org.opencontainers.image.title=$(basename "${SBOM}")" \
            --annotation "org.opencontainers.image.description=Syft SBOM for Kyth image ${VERSION}" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            "${IMAGE}@${DIGEST}" \
            "${SBOM}")"
          SBOM_DIGEST="$(jq -r '.digest' <<< "${ATTACH_OUTPUT}")"
          build_files/scripts/validate-digest.sh "${SBOM_DIGEST}"
          echo "digest=${SBOM_DIGEST}" >> "$GITHUB_OUTPUT"
          cosign sign -y --key "${KYTH_SIGNING_KEY_FILE}" "${IMAGE}@${SBOM_DIGEST}"
          cosign sign -y "${IMAGE}@${SBOM_DIGEST}"

      - name: Verify published signatures
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.meta.outputs.digest }}
          SBOM_DIGEST: ${{ steps.attach_sbom.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify --key build_files/config/containers/kyth-cosign.pub "${IMAGE}@${DIGEST}"
          cosign verify --key build_files/config/containers/kyth-cosign.pub "${IMAGE}@${SBOM_DIGEST}"
          IDENTITY="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/supply-chain\\.yml@refs/heads/(main|testing)$"
          ISSUER="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity-regexp "${IDENTITY}" --certificate-oidc-issuer "${ISSUER}" "${IMAGE}@${DIGEST}"
          cosign verify --certificate-identity-regexp "${IDENTITY}" --certificate-oidc-issuer "${ISSUER}" "${IMAGE}@${SBOM_DIGEST}"
          # Build provenance was verified BEFORE signing (see
          # "Verify build provenance before signing" above).

      - name: Remove image signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/kyth-cosign.key"

      # The changelog release now publishes here, inside the gated publish job
      # AFTER signature verification — never from the ungated prepare job. A
      # denied publish leaves no public release for an unverified image.
      - name: Publish image changelog release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          NOTES_FILE: output/supply-chain/${{ steps.meta.outputs.notes }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          RELEASE_TAG="image-${VERSION//./-}"
          TITLE="Kyth Image - ${VERSION}"
          PRERELEASE=""
          if [[ "${SOURCE_TAG}" != "latest" ]]; then
            PRERELEASE="--prerelease"
          fi

          if gh release view "${RELEASE_TAG}" &>/dev/null; then
            gh release edit "${RELEASE_TAG}" --title "${TITLE}" --notes-file "${NOTES_FILE}" ${PRERELEASE}
          else
            gh release create "${RELEASE_TAG}" \
              --target "${SOURCE_SHA}" \
              --title "${TITLE}" \
              --notes-file "${NOTES_FILE}" \
              ${PRERELEASE}
          fi

      # Promote the floating tag (testing/latest) to the verified digest ONLY
      # after the changelog release exists. The build job pushes immutable
      # tags only, so the Hub can never discover an update before its release
      # notes are published. This also guarantees the floating tag never
      # points at an unsigned/unscanned image.
      #
      # oras tag, NOT imagetools create: imagetools wraps a bare manifest in
      # a freshly synthesized index, so the floating tag would resolve to a
      # NEW digest that matches nothing — not the cosign signature, not the
      # SBOM referrer's subject, and not the digest printed in the release
      # body. That broke the CVE scan's SBOM lookup and the Hub's
      # release-notes matching (both keyed by digest). oras tag points the
      # tag at the exact verified digest, manifest or index alike.
      - name: Promote floating tag to verified digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.meta.outputs.digest }}
          FLOATING_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          oras tag "${IMAGE}@${DIGEST}" "${FLOATING_TAG}"
          echo "Promoted ${IMAGE}:${FLOATING_TAG} to ${DIGEST}"

      - name: Dispatch Live ISO after image verification
        if: inputs.dispatch_iso == 'true' || inputs.dispatch_iso == true
        uses: ./.github/actions/dispatch-workflow
        with:
          workflow: build-live-iso.yml
          ref: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fields-json: |
            {
              "source_tag": ${{ toJSON(inputs.source_tag) }},
              "source_digest": ${{ toJSON(inputs.source_digest) }},
              "source_sha": ${{ toJSON(inputs.source_sha) }},
              "run_acceptance": "false"
            }

      - name: Trigger CVE scan
        uses: ./.github/actions/dispatch-workflow
        with:
          workflow: cve-scan.yml
          ref: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fields-json: |
            {
              "source_tag": ${{ toJSON(inputs.source_tag) }}
            }

  # Maintenance copy, not a new stable build or testing-to-main promotion.
  # Preserve original labels/provenance and all source images. No ISO/release
  # dispatches: those existing stable images predate the consumer-default fix.
  migrate_stable:
    name: Migrate unchanged stable (${{ inputs.source_tag }})
    if: inputs.migrate_legacy_stable == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stable-release
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: supply-chain-publish-${{ inputs.source_tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MIGRATE_LEGACY_STABLE: ${{ toJSON(inputs.migrate_legacy_stable) }}
      ORIGINAL_EVENT: ${{ inputs.original_event }}
      SOURCE_TAG: ${{ inputs.source_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_DIGEST: ${{ inputs.source_digest }}
      LEGACY_IMAGE: ghcr.io/kyth-os/kyth
      DESTINATION_IMAGE: ghcr.io/mrtrickdotorg/kyth
    steps:
      - name: Checkout maintenance code at workflow SHA
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup ORAS
        uses: ./.github/actions/setup-oras
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Cosign
        uses: ./.github/actions/setup-cosign
      - name: Install native image verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Authenticate destination registry
        uses: ./.github/actions/registry-login
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          docker: "true"
      - name: Verify legacy build provenance
        run: |
          set -euo pipefail
          # Validate caller fields before using them in registry or API paths.
          [[ "${SOURCE_TAG}" == latest || "${SOURCE_TAG}" == latest-cachy ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${SOURCE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          export MAIN_SHA
          LEGACY_DIGEST="$(skopeo inspect --no-creds "docker://${LEGACY_IMAGE}:${SOURCE_TAG}" --format '{{.Digest}}')"
          export LEGACY_DIGEST
          python3 .github/scripts/validate-stable-migration.py > "${RUNNER_TEMP}/migration-context.json"
          test "$(gh api repos/kyth-os/kyth --jq .id)" = "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .id)"
          skopeo inspect --no-creds "docker://${LEGACY_IMAGE}@${SOURCE_DIGEST}" > "${RUNNER_TEMP}/legacy-image.json"
          jq -e --arg sha "${SOURCE_SHA}" --arg base "${LEGACY_IMAGE}:base-${SOURCE_TAG}" \
            '.Labels["org.opencontainers.image.revision"] == $sha and .Labels["org.opencontainers.image.base.name"] == $base' \
            "${RUNNER_TEMP}/legacy-image.json"
          gh attestation verify "oci://${LEGACY_IMAGE}@${SOURCE_DIGEST}" \
            --bundle-from-oci --repo kyth-os/kyth \
            --signer-workflow kyth-os/kyth/.github/workflows/build.yml \
            --source-digest "${SOURCE_SHA}" --source-ref refs/heads/main \
            --deny-self-hosted-runners --format json > "${RUNNER_TEMP}/legacy-provenance.json"
          # Refuse to replace a separately published destination stable image.
          oras repo tags "${DESTINATION_IMAGE}" --format json > "${RUNNER_TEMP}/destination-tags.json"
          if jq -e --arg tag "${SOURCE_TAG}" '.tags | index($tag) != null' "${RUNNER_TEMP}/destination-tags.json"; then
            test "$(skopeo inspect --no-creds "docker://${DESTINATION_IMAGE}:${SOURCE_TAG}" --format '{{.Digest}}')" = "${SOURCE_DIGEST}"
          fi
      - name: Copy verified immutable image and attached evidence
        run: |
          set -euo pipefail
          CANDIDATE="migration-${SOURCE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Remote copy preserves bytes and recursively retains OCI provenance
          # and SBOM referrers. It makes no claim that this was destination-built.
          oras copy --recursive "${LEGACY_IMAGE}@${SOURCE_DIGEST}" "${DESTINATION_IMAGE}:${CANDIDATE}"
          test "$(skopeo inspect --no-creds "docker://${DESTINATION_IMAGE}:${CANDIDATE}" --format '{{.Digest}}')" = "${SOURCE_DIGEST}"
          gh attestation verify "oci://${DESTINATION_IMAGE}@${SOURCE_DIGEST}" \
            --bundle-from-oci --repo kyth-os/kyth \
            --signer-workflow kyth-os/kyth/.github/workflows/build.yml \
            --source-digest "${SOURCE_SHA}" --source-ref refs/heads/main \
            --deny-self-hosted-runners --format json > "${RUNNER_TEMP}/copied-provenance.json"
      - name: Sign destination identity
        env:
          KYTH_COSIGN_PRIVATE_KEY: ${{ secrets.KYTH_COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.KYTH_COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KYTH_COSIGN_PRIVATE_KEY}"
          test -n "${COSIGN_PASSWORD}"
          umask 077
          KEY="${RUNNER_TEMP}/migration-cosign.key"
          trap 'rm -f "${KEY}"' EXIT
          printf '%s' "${KYTH_COSIGN_PRIVATE_KEY}" > "${KEY}"
          cosign sign -y --key "${KEY}" "${DESTINATION_IMAGE}@${SOURCE_DIGEST}"
          cosign sign -y "${DESTINATION_IMAGE}@${SOURCE_DIGEST}"
      - name: Verify destination signatures and policy
        run: |
          set -euo pipefail
          cosign verify --key build_files/config/containers/kyth-cosign.pub \
            "${DESTINATION_IMAGE}@${SOURCE_DIGEST}" > "${RUNNER_TEMP}/destination-static-signature.json"
          cosign verify \
            --certificate-identity 'https://github.com/mrtrickdotorg/kyth/.github/workflows/supply-chain.yml@refs/heads/testing' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${DESTINATION_IMAGE}@${SOURCE_DIGEST}" > "${RUNNER_TEMP}/destination-keyless-signature.json"
          # Exercise containers/image's real sigstoreSigned matchRepository
          # policy, with the same public key and registry attachment lookup.
          jq --arg key "${GITHUB_WORKSPACE}/build_files/config/containers/kyth-cosign.pub" \
            '{default:[{type:"reject"}],transports:{docker:{"ghcr.io/mrtrickdotorg/kyth":[{type:"sigstoreSigned",keyPath:$key,signedIdentity:{type:"matchRepository"}}]}}}' \
            -n > "${RUNNER_TEMP}/migration-policy.json"
          skopeo --policy "${RUNNER_TEMP}/migration-policy.json" \
            --registries.d build_files/config/containers/registries.d \
            copy --all --preserve-digests --src-no-creds \
            "docker://${DESTINATION_IMAGE}@${SOURCE_DIGEST}" "dir:${RUNNER_TEMP}/verified-stable-pull"
      - name: Promote unchanged stable digest
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          export MAIN_SHA
          LEGACY_DIGEST="$(skopeo inspect --no-creds "docker://${LEGACY_IMAGE}:${SOURCE_TAG}" --format '{{.Digest}}')"
          export LEGACY_DIGEST
          python3 .github/scripts/validate-stable-migration.py
          oras repo tags "${DESTINATION_IMAGE}" --format json > "${RUNNER_TEMP}/destination-tags.json"
          if jq -e --arg tag "${SOURCE_TAG}" '.tags | index($tag) != null' "${RUNNER_TEMP}/destination-tags.json"; then
            test "$(skopeo inspect --no-creds "docker://${DESTINATION_IMAGE}:${SOURCE_TAG}" --format '{{.Digest}}')" = "${SOURCE_DIGEST}"
          fi
          oras tag "${DESTINATION_IMAGE}@${SOURCE_DIGEST}" "${SOURCE_TAG}"
          test "$(skopeo inspect --no-creds "docker://${DESTINATION_IMAGE}:${SOURCE_TAG}" --format '{{.Digest}}')" = "${SOURCE_DIGEST}"
          test "$(skopeo inspect --no-creds "docker://${LEGACY_IMAGE}:${SOURCE_TAG}" --format '{{.Digest}}')" = "${SOURCE_DIGEST}"
      - name: Preserve migration verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-registry-migration-${{ inputs.source_tag }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/migration-context.json
            ${{ runner.temp }}/legacy-image.json
            ${{ runner.temp }}/legacy-provenance.json
            ${{ runner.temp }}/copied-provenance.json
            ${{ runner.temp }}/destination-static-signature.json
            ${{ runner.temp }}/destination-keyless-signature.json
          if-no-files-found: warn
          retention-days: 30
