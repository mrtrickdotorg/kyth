name: Upload to Cloudflare R2
description: Upload ISO build artifacts to Cloudflare R2 bucket.
inputs:
  r2-access-key-id:
    description: Access key ID for R2 bucket.
    required: true
  r2-secret-access-key:
    description: Secret access key for R2 bucket.
    required: true
  r2-endpoint-url:
    description: Cloudflare R2 S3 endpoint URL.
    required: false
  r2-account-id:
    description: Cloudflare Account ID (to construct endpoint if r2-endpoint-url is not set).
    required: false
  iso-basename:
    description: Filename of the built ISO.
    required: true
  channel-basename:
    description: Filename of the channel ISO.
    required: true
  source-dir:
    description: Directory where built artifacts reside.
    required: false
    default: output/live-iso
  bucket:
    description: R2 bucket name.
    required: false
    default: kyth-releases
  retention-keep:
    description: Immutable ISO builds to keep per channel; older build sets are purged after upload.
    required: false
    default: "5"
runs:
  using: composite
  steps:
    # A path bug here stayed hidden for weeks: the retention step below is
    # continue-on-error (a purge outage must not block a release), so a
    # mispathed script only printed a traceback nobody read. Locating the
    # script is a repository invariant with no network involved, so it is
    # checked in a step that is allowed to fail the publish loudly.
    - name: Locate the R2 retention script
      id: locate-retention
      shell: bash
      run: |
        set -euo pipefail

        # github.action_path is .github/actions/upload-r2, so a fixed count of
        # .. segments only worked until the action moved (two of them resolved
        # to .github/build_files/...). The checkout root does not move: this is
        # a repository-local action, used only from the repo that ships it.
        script="${GITHUB_WORKSPACE}/build_files/scripts/r2_retention.py"
        if [[ ! -f "${script}" ]]; then
          echo "::error title=R2 retention script missing::Expected ${script}; refusing to publish with retention silently disabled."
          exit 1
        fi
        # A step output, not GITHUB_ENV: an env-file write is re-parsed by
        # every later step in the job, which is why zizmor's github-env audit
        # rejects it wherever the value is not a literal.
        echo "script=${script}" >> "${GITHUB_OUTPUT}"

    - name: Run R2 upload script
      id: upload
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.r2-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.r2-secret-access-key }}
        # R2 only accepts its own region names ('auto', wnam, ...). The
        # 2026-11-13 publish died with InvalidRegionName because the
        # runner image began supplying a us-west-2 default; pin 'auto'
        # so the CLI never inherits a region R2 rejects.
        AWS_DEFAULT_REGION: auto
        AWS_REGION: auto
        R2_ENDPOINT_URL: ${{ inputs.r2-endpoint-url }}
        R2_ACCOUNT_ID: ${{ inputs.r2-account-id }}
        ISO_BASENAME: ${{ inputs.iso-basename }}
        CHANNEL_BASENAME: ${{ inputs.channel-basename }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        BUCKET: ${{ inputs.bucket }}
      run: |
        set -euo pipefail

        if [[ -n "${R2_ENDPOINT_URL:-}" ]]; then
          R2_ENDPOINT="${R2_ENDPOINT_URL%/}"
        elif [[ "${R2_ACCOUNT_ID:-}" == https://* ]]; then
          R2_ENDPOINT="${R2_ACCOUNT_ID%/}"
        elif [[ -n "${R2_ACCOUNT_ID:-}" ]]; then
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
        else
          echo "::error::Set r2-endpoint-url or r2-account-id."
          exit 1
        fi

        if [[ ! "${R2_ENDPOINT}" =~ ^https://[A-Za-z0-9.-]+\.r2\.cloudflarestorage\.com$ ]]; then
          echo "::error::Invalid R2 endpoint URL: ${R2_ENDPOINT}"
          echo "::error::Expected a value like https://<account-id>.r2.cloudflarestorage.com"
          exit 1
        fi

        # Handed to the retention step below as an output rather than through
        # GITHUB_ENV: the endpoint is derived from an input, and an env-file
        # write becomes part of every later step's environment.
        echo "r2-endpoint=${R2_ENDPOINT}" >> "${GITHUB_OUTPUT}"

        ISO="${SOURCE_DIR}/${ISO_BASENAME}"
        CHANNEL="${SOURCE_DIR}/${CHANNEL_BASENAME}"

        # Sidecars land before the ISO in both sets: a consumer that sees
        # the ISO key must always find its checksum/signature beside it.
        for artifact in "${ISO}-CHECKSUM" "${ISO}.sig" "${ISO}.bundle" "${ISO}.intoto.jsonl" "${ISO}.json" "${ISO}"; do
          aws s3 cp "${artifact}" \
            "s3://${BUCKET}/$(basename "${artifact}")" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress
        done

        for suffix in -CHECKSUM .sig .bundle .intoto.jsonl .json; do
          aws s3 cp "${CHANNEL}${suffix}" \
            "s3://${BUCKET}/$(basename "${CHANNEL}${suffix}")" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress
        done
        # The channel key is the pointer consumers poll: it moves last,
        # once every sidecar (and the immutable set above) is in place.
        aws s3 cp "${ISO}" "s3://${BUCKET}/$(basename "${CHANNEL}")" \
          --endpoint-url "${R2_ENDPOINT}" --no-progress

    # Retention runs after a successful upload and purges immutable build
    # sets beyond the newest few per channel (the bucket grew to ~3 TB
    # before this existed). It must never fail a release: the plan only
    # ever names strict immutable-build keys, and the step is
    # continue-on-error so a retention outage cannot block publishing.
    # Because that flag also hides real breakage, the step reports its own
    # failure as an ::error annotation and the script's existence was already
    # enforced by the non-advisory step above.
    - name: Purge old ISO builds from R2 (keep newest ${{ inputs.retention-keep }} per channel)
      shell: bash
      continue-on-error: true
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.r2-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.r2-secret-access-key }}
        AWS_DEFAULT_REGION: auto
        AWS_REGION: auto
        BUCKET: ${{ inputs.bucket }}
        RETENTION_KEEP: ${{ inputs.retention-keep }}
        R2_ENDPOINT: ${{ steps.upload.outputs.r2-endpoint }}
        R2_RETENTION_SCRIPT: ${{ steps.locate-retention.outputs.script }}
      run: |
        set -euo pipefail

        if [[ -z "${R2_ENDPOINT:-}" ]]; then
          echo "::warning::R2_ENDPOINT is unset; skipping R2 retention."
          exit 0
        fi

        if [[ -z "${R2_RETENTION_SCRIPT:-}" ]]; then
          echo "::error title=R2 retention script unresolved::The locate step did not hand over R2_RETENTION_SCRIPT; nothing was purged."
          exit 1
        fi

        # Re-emit failures as annotations: continue-on-error keeps the step red
        # in the job view without failing the run, which is easy to miss in a
        # long publish log.
        rc=0
        python3 "${R2_RETENTION_SCRIPT}" \
          --bucket "${BUCKET}" \
          --endpoint-url "${R2_ENDPOINT}" \
          --keep "${RETENTION_KEEP}" || rc=$?
        if [[ "${rc}" -ne 0 ]]; then
          echo "::error title=R2 retention failed::${R2_RETENTION_SCRIPT} exited ${rc}; old ISO build sets were not purged and the bucket keeps growing."
          exit "${rc}"
        fi
