target-version = "py311"
line-length = 120

# The only extensionless Hub executable is the Bash compatibility-named
# launcher; keep it out of Ruff's Python discovery.

[lint]
# Correctness + blind-except (BLE001) — bare `except Exception:` now surfaces.
# Existing debt is grandfathered via per-file-ignores below; new code must
# name the exception or use `except Exception as exc:` with handling.
select = ["E9", "F63", "F7", "F82", "BLE001"]

[lint.per-file-ignores]
# Grandfathered until S10 cleanup — new files must not add bare broad-except.
"build_files/**/*.py" = ["BLE001"]
"tests/**/*.py" = ["BLE001"]
".github/scripts/**/*.py" = ["BLE001"]
# src/ is the tree the image installs (and what the build_files/ symlinks
# point at). Grandfather these four files, not the tree: new src/ modules must
# be clean, so the gate actually starts covering the shipped runtime.
"src/kyth-installer/kyth_installer/app.py" = ["BLE001"]
"src/kyth_shared/kyth_shared/memory_tune.py" = ["BLE001"]
"src/kyth_shared/kyth_shared/system/boot_runtime.py" = ["BLE001"]
